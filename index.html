.bar{position:sticky;top:0;background:var(--bg);padding:8px 16px;z-index:5;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tab{flex:1;padding:9px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:13.5px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}.chip{white-space:nowrap;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font-size:12.5px}
.chip.on{background:var(--ink);color:var(--bg)}
main{padding:10px 16px 40px;max-width:760px;margin:auto}
.note{font-size:12.5px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.nm{margin:4px 0 6px;font-weight:600;overflow-wrap:anywhere}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.now{font-size:19px;font-weight:700}.was{color:var(--mut);text-decoration:line-through;font-size:13px}
.off{background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700}
.tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px}.g{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.hist{font-size:12.5px;color:var(--mut);margin-top:4px}.more{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.empty{text-align:center;color:var(--mut);padding:30px 0}
</style></head><body>
