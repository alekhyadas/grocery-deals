<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Kolkata Deals</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#16211f;--mut:#5b6b67;--line:#dfe5e2;--acc:#0f766e;--accbg:#e3f3f0;--good:#0a7a3d;--goodbg:#e2f5e8;--warn:#a15c00;--warnbg:#fbeed6}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#16211f;--ink:#eaf2ef;--mut:#95a8a3;--line:#26332f;--acc:#3ecfbf;--accbg:#123530;--good:#4ade80;--goodbg:#12301f;--warn:#f0b04a;--warnbg:#3a2a0e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif}
header{padding:16px 16px 6px}h1{margin:0;font-size:21px}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
#q{flex:1 1 100%}select{flex:1 1 140px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
main{padding:12px 16px 40px;display:grid;gap:10px;max-width:760px;margin:0 auto}
.count{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:grid;gap:5px}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.site{font-weight:700;color:var(--acc)}
.name{color:var(--ink);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.name:hover{text-decoration:underline}
.prices{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.p{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.m{color:var(--mut);text-decoration:line-through;font-size:13px}
.off{font-size:12px;font-weight:700;color:var(--good)}
.hist{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.bh{font-size:12.5px;color:var(--ink);background:var(--accbg);border-radius:8px;padding:6px 9px;font-variant-numeric:tabular-nums}
.bh a{color:var(--acc);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:6px}
.t-low{background:var(--goodbg);color:var(--good)}.t-warn{background:var(--warnbg);color:var(--warn)}
button.more{font:inherit;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--acc);background:var(--accbg);color:var(--acc);cursor:pointer}
.empty{color:var(--mut);padding:20px 0;text-align:center}
</style></head><body>
<header><h1>Kolkata Deals</h1><div class="sub">Every tracked in-stock product. Updated 06 Oct, 09:00 PM IST. Check the price in the app before paying.</div></header>
<div class="bar">
<div class="row"><input id="q" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off"></div>
<div class="row"><select id="site" aria-label="Site"><option value="">All sites</option></select>
<select id="sort" aria-label="Sort">
<option value="drop">Biggest drop vs usual</option>
<option value="low">Closest to own lowest</option>
<option value="bhlow">Closest to BuyHatke low</option>
<option value="off">% off MRP</option>
<option value="pa">Price low to high</option>
<option value="pd">Price high to low</option>
<option value="new">Recently checked</option></select></div>
<div class="chips"><button class="chip" id="f-low" aria-pressed="false">At own lowest ever</button>
<button class="chip" id="f-bh" aria-pressed="false">Has BuyHatke</button>
<button class="chip" id="f-bhlow" aria-pressed="false">At BuyHatke 1y low</button>
<button class="chip" id="f-hist" aria-pressed="false">3+ checks</button></div>
</div>
<main><div class="count" id="count">Loading...</div><div id="list"></div><button class="more" id="more" hidden>Show more</button></main>
<script>
(function(){
var R=[],V=[],shown=0,PAGE=50,$=function(i){return document.getElementById(i)};
var fl={low:0,bh:0,bhlow:0,hist:0};
function inr(x){return x==null?"":"\u20B9"+Math.round(x).toLocaleString("en-IN")}
function enrich(r){var p=r[2],m=r[3],lo=r[4],av=r[5],n=r[6],bl=r[7];
 return{r:r,off:m&&m>p?(m-p)/m*100:0,
  drop:(n>=3&&av>p&&av<=p*2.5)?(av-p)/av*100:0,
  atlow:n>=3&&p<=lo*1.005&&av>p*1.03&&av<=p*2.5,
  lowr:n>=3?p/lo:9,
  bhr:bl?p/bl:9,
  bhat:bl!=null&&p<=bl*1.02};}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function card(o){var r=o.r,c=el("div","card"),t=el("div","top");
 t.appendChild(el("span","site",r[0]));t.appendChild(el("span",null,r[11]?"Checked "+r[11]:""));c.appendChild(t);
 var a=el("a","name",r[1]);a.href=r[10];a.target="_blank";a.rel="noopener noreferrer";c.appendChild(a);
 var pr=el("div","prices");pr.appendChild(el("span","p",inr(r[2])));
 if(r[3]&&r[3]>r[2]){pr.appendChild(el("span","m",inr(r[3])));pr.appendChild(el("span","off",Math.round(o.off)+"% off MRP"))}
 c.appendChild(pr);
 var tg=el("div");
 if(o.atlow)tg.appendChild(el("span","tag t-low","AT OWN LOWEST"));
 else if(o.drop>=5)tg.appendChild(el("span","tag t-low",Math.round(o.drop)+"% below usual"));
 if(o.bhat)tg.appendChild(el("span","tag t-low","AT BUYHATKE 1Y LOW"));
 if(tg.childNodes.length)c.appendChild(tg);
 c.appendChild(el("div","hist",r[6]>=2?"Own history: lowest "+inr(r[4])+", usual "+inr(r[5])+" ("+r[6]+" checks)":"Only "+r[6]+" check so far, no history yet"));
 if(r[7]!=null){var b=el("div","bh");b.appendChild(document.createTextNode("BuyHatke 1y: low "+inr(r[7])+(r[8]!=null?", high "+inr(r[8]):"")+(o.bhr<9&&!o.bhat?" \u00B7 now "+Math.round((o.bhr-1)*100)+"% above low":"")+"  "));
  if(r[9]){var l=el("a",null,"Open on BuyHatke");l.href=r[9];l.target="_blank";l.rel="noopener noreferrer";b.appendChild(l)}
  c.appendChild(b)}
 return c}
function apply(){var q=$("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean),s=$("site").value,k=$("sort").value;
 V=R.filter(function(o){var r=o.r;if(s&&r[0]!==s)return false;
  if(fl.low&&!o.atlow)return false;if(fl.bh&&r[7]==null)return false;if(fl.bhlow&&!o.bhat)return false;if(fl.hist&&r[6]<3)return false;
  if(q.length){var h=(r[1]+" "+r[0]).toLowerCase();for(var i=0;i<q.length;i++)if(h.indexOf(q[i])<0)return false}return true});
 var cmp={drop:function(a,b){return b.drop-a.drop},low:function(a,b){return a.lowr-b.lowr||b.drop-a.drop},
  bhlow:function(a,b){return a.bhr-b.bhr},off:function(a,b){return b.off-a.off},
  pa:function(a,b){return a.r[2]-b.r[2]},pd:function(a,b){return b.r[2]-a.r[2]},new:function(a,b){return 0}}[k];
 if(k==="bhlow")V=V.filter(function(o){return o.r[7]!=null});
 V.sort(cmp);shown=0;$("list").textContent="";more();}
function more(){var l=$("list"),e=Math.min(V.length,shown+PAGE);
 for(var i=shown;i<e;i++)l.appendChild(card(V[i]));shown=e;
 $("more").hidden=shown>=V.length;
 $("count").textContent=V.length.toLocaleString("en-IN")+" of "+R.length.toLocaleString("en-IN")+" products";
 if(!V.length&&!$("list").firstChild)$("list").appendChild(el("div","empty","Nothing matches. Clear a filter or the search."))}
var tm;$("q").addEventListener("input",function(){clearTimeout(tm);tm=setTimeout(apply,200)});
$("site").addEventListener("change",apply);$("sort").addEventListener("change",apply);$("more").addEventListener("click",more);
["low","bh","bhlow","hist"].forEach(function(k){var b=$("f-"+k);b.addEventListener("click",function(){fl[k]=fl[k]?0:1;b.setAttribute("aria-pressed",fl[k]?"true":"false");apply()})});
fetch("data.json?v="+Date.now()).then(function(r){return r.json()}).then(function(d){
 R=d.rows.map(enrich);var cnt={};R.forEach(function(o){cnt[o.r[0]]=(cnt[o.r[0]]||0)+1});
 Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).forEach(function(s){var op=el("option",null,s+" ("+cnt[s].toLocaleString("en-IN")+")");op.value=s;$("site").appendChild(op)});
 apply()}).catch(function(){$("count").textContent="Could not load the price list. Refresh in a minute."});
})();
</script></body></html>
